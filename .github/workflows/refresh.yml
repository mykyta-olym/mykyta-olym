name: Refresh profile card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - art/**
      - scripts/build_profile.py

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build cards from live data
        run: python3 scripts/build_profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit only if the numbers changed
        run: |
          if git diff --quiet -- profile-dark.svg profile-light.svg; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-dark.svg profile-light.svg
          git commit -m "chore: refresh profile card"
          git push
